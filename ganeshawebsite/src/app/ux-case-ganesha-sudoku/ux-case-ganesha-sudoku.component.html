<div class="container py-4">
    <app-page-header [title]="'UX_CASE_GANESHA_SUDOKU.pageTitle' | translate" [back]="'/ux-cases'">
    </app-page-header>

    <p class="lead text-center mb-4">
        {{ 'UX_CASE_GANESHA_SUDOKU.intro' | translate }}
    </p>

    <div class="timeline">
        <div class="timeline-item" *ngFor="let item of timeline">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <h5 class="timeline-title">{{ item.titleKey | translate }}</h5>
                <p class="timeline-desc">{{ item.descKey | translate }}</p>
            </div>
        </div>
    </div>


    <section class="diagram-section">
        <h3>{{ 'UX_CASE_GANESHA_SUDOKU.backtrackingDiagram.title' | translate }}</h3>
        <!-- le SVG ici -->
        <div class="diagram-container">
            <!-- insère le SVG ci‑dessus -->
            <svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Start -->
  <rect x="300" y="10" width="100" height="40" rx="8" fill="#23384E"/>
  <text x="350" y="35" fill="#fff" font-size="14" text-anchor="middle">Start</text>

  <!-- Check valid -->
  <rect x="300" y="80" width="100" height="40" rx="8" fill="#556B78"/>
  <text x="350" y="105" fill="#fff" font-size="12" text-anchor="middle">Check valid?</text>

  <!-- Valid decision arrow -->
  <line x1="350" y1="50" x2="350" y2="80" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Valid decision path -->
  <line x1="350" y1="120" x2="250" y2="180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="170" font-size="12" fill="#000">Yes</text>

  <!-- Place value -->
  <rect x="200" y="190" width="150" height="40" rx="8" fill="#9BB7D4"/>
  <text x="275" y="215" font-size="12" fill="#000" text-anchor="middle">Place value</text>

  <!-- Next cell -->
  <line x1="275" y1="230" x2="275" y2="280" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="280" width="150" height="40" rx="8" fill="#23384E"/>
  <text x="275" y="305" font-size="12" fill="#fff" text-anchor="middle">Next cell</text>

  <!-- No path -->
  <line x1="350" y1="120" x2="450" y2="180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="170" font-size="12" fill="#000">No</text>

  <!-- Backtrack -->
  <rect x="450" y="190" width="150" height="40" rx="8" fill="#D47A7A"/>
  <text x="525" y="215" font-size="12" fill="#000" text-anchor="middle">Backtrack</text>

  <!-- Back to top -->
  <line x1="525" y1="230" x2="350" y2="50" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow head marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
</svg>

        </div>
    </section>
</div>
