<div class="container px-5 py-4">

    <app-page-header [title]="'UX_CASE_GANESHA_SUDOKU.pageTitle' | translate" [back]="'/ux-cases'">
    </app-page-header>

    <!-- Introduction -->
    <div class="lead text-center mb-5" [innerHTML]="'UX_CASE_GANESHA_SUDOKU.intro' | translate">
    </div>

    <!-- Timeline améliorée -->
    <div class="timeline-modern">

        <div class="timeline-line"></div>

        <div class="timeline-item" *ngFor="let item of timeline; let i = index">
            <!-- Cercle numéroté -->
            <div class="timeline-circle">{{ i + 1 }}</div>

            <div class="timeline-text">
                <h5 class="timeline-title" [innerHTML]="item.titleKey | translate"></h5>

                <div class="timeline-desc" [innerHTML]="item.descKey | translate"></div>
            </div>
        </div>

    </div>

</div>
