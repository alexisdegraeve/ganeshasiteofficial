<div class="container py-4 pb-5">

    <app-page-header [title]="'UX_CASE_GANESHA_SUDOKU.pageTitle' | translate" [back]="'/ux-cases'"></app-page-header>

    <!-- Introduction -->
    <div class="lead mb-5" [innerHTML]="'UX_CASE_GANESHA_SUDOKU.intro' | translate"></div>

    <!-- Timeline simplified -->
    <div class="timeline-simplified">
        <div *ngFor="let item of timeline; let i = index" class="mb-4">
            <h2 class="timeline-title" [innerHTML]="item.titleKey | translate"></h2>
            <p class="timeline-desc" [innerHTML]="item.descKey | translate"></p>
        </div>
    </div>

    <!-- Mockups -->
    <section class="mockups-section mt-5">
        <h2 class="mockups-title">{{ 'UX_CASE_GANESHA_SUDOKU.mockups.title' | translate }}</h2>
        <p class="mockups-desc">{{ 'UX_CASE_GANESHA_SUDOKU.mockups.desc' | translate }}</p>

        <div class="row g-4">
            <div *ngFor="let mock of mockups" class="col-12 col-md-6">
                <div class="card h-100 text-center">
                    <img [src]="mock.thumb" [alt]="mock.alt | translate" class="img-fluid card-img-top">
                    <div class="card-body">
                        <h6 class="card-title">{{ mock.alt | translate }}</h6>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex align-items-center mt-4">
            <a role="button" href="https://sudoku.ganesha.ovh/" target="_blank" class="ms-auto btn btn-lg btn-danger" rel="noopener noreferrer">
        {{ 'GAMES.play' | translate }}
      </a>
        </div>
    </section>

</div>
