<div class="container px-5 py-4">

    <!-- Scenario -->
    <h1 class="mt-4">Scenario</h1>
    <p [innerHTML]="'UX_CASE_GANESHA_BATTLEFIELD.intro' | translate">
    </p>

    <div class="timeline-simplified">
        <div *ngFor="let item of timeline" class="mb-4">
            <h2 class="timeline-title" [innerHTML]="item.titleKey | translate"></h2>
            <p class="timeline-desc" [innerHTML]="item.descKey | translate"></p>
        </div>
    </div>

    <!-- Maquettes section -->
    <section class="mockups-section mt-5">
        <h2 class="mockups-title">{{ 'UX_CASE_GANESHA_BATTLEFIELD.mockups.title' | translate }}</h2>
        <p class="mockups-desc">{{ 'UX_CASE_GANESHA_BATTLEFIELD.mockups.desc' | translate }}</p>

        <div class="row g-4">
            <div *ngFor="let mock of mockups" class="col-12 col-md-6">
                <div class="card h-100 text-center">
                    <img [src]="mock.thumb" [alt]="mock.alt | translate" class="img-fluid card-img-top">
                    <div class="card-body">
                        <h6 class="card-title">{{ mock.label | translate }}</h6>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <a role="button" [href]="gameLink" target="_blank" class="btn btn-lg btn-danger open-game-btn" rel="noopener noreferrer">
        {{ 'UX_CASE_GANESHA_BATTLEFIELD.openGameBtn' | translate }}
      </a>
        </div>
    </section>

</div>
