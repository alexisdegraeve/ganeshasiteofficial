<div class="container py-4">
    <app-page-header [title]="'PORTFOLIO.title-mockups'" [back]="'/portfolio'"></app-page-header>
    <div class="mb-5">
        <blockquote class="blockquote">
            <p class="mb-3 fst-italic">
                <i class="fa fa-star me-2"></i> "Good design is obvious. Great design is transparent."
            </p>
            <footer class="blockquote-footer">
                Joe Sparano
            </footer>
        </blockquote>
    </div>


    <!-- Galerie d'images -->
    <div class="row g-4">
        <div class="col-sm-6 col-md-4" *ngFor="let image of archGallery[selectedTab].images">
            <div class="card shadow-sm h-100 d-flex flex-column position-relative">
                <div class="card-body cursor-pointer" (click)="openImageInModal(image)">
                    <img [src]="image.url" [alt]="image.alt" class="card-img-top rounded">
                </div>
                <div class="card-footer mt-auto text-end">
                    <p class="card-text mb-2 text-center">{{ image.alt | translate }}</p>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for displaying large images -->
<div class="modal fade" id="galleryModal" tabindex="-1" aria-labelledby="galleryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="galleryModalLabel">{{ selectedImage?.alt }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <img *ngIf="selectedImage" [src]="selectedImage.url" class="img-fluid rounded" alt="{{ selectedImage.alt }}">
            </div>
        </div>
    </div>
